# Merge these component blocks into an Elemental RL experiment.
# Supply a policy wrapper that emits bounded [N, 1, 3] controls; this fragment
# does not turn the existing unbounded VLA diffusion policy into that policy.
# Actual game actions begin only when the instantiated environment is used.
mode: rl
action_dim: 3
num_action_chunks: 1

env:
  _target_: trackmaniabench.live.elemental.ElementalTrackManiaEnv
  num_envs: 1
  backend_kind: realtime
  backend_kwargs:
    telemetry_host: 127.0.0.1
    telemetry_port: 9000
    control: gamepad
    # Desktop coordinates of the game content, established during live setup.
    capture_region: ???
    # Map-specific start position measured from trusted reset telemetry.
    expected_start_position: ???
    action_lease_seconds: 10.0
  env_kwargs:
    control_hz: 20.0
    max_episode_seconds: 120.0
  image_size: [224, 224]
  text_prompt: Drive the Trackmania circuit to the finish.
  device: cpu

rl:
  _target_: rl.ppo.PPOAlgorithm
  # Short integration sample. Stock PPO resets every rollout: increase this
  # for a complete track or implement a collector that preserves episodes.
  steps_per_rollout: 128
  num_policy_epochs: 4
  minibatch_size: 32
  gae:
    _target_: rl.advantages.GAEConfig
    # Stock Elemental GAE discounts per decision, regardless of wall duration.
    gamma: 0.99
    lam: 0.95

rollout_buffer:
  _target_: rl.rollout_buffer.OnPolicyRolloutBuffer
  num_steps: ${rl.steps_per_rollout}
  num_envs: ${env.num_envs}
  action_shape: [1, 3]
  obs_keys: [image, text, telemetry, timing, previous_action, applied_action]
