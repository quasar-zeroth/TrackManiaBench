# Optional experimental TICK server integration; no RGB rendering is provided
# by the tickgym API. A compatible server must already be installed separately.
# Merge these blocks into an Elemental RL experiment with a telemetry policy.
mode: rl
action_dim: 3
num_action_chunks: 1

env:
  _target_: trackmaniabench.live.elemental.ElementalTrackManiaEnv
  num_envs: 1
  backend_kind: tickgym
  backend_kwargs:
    map_path: ???
    origin: http://127.0.0.1:46323
    timeout: 120.0
  env_kwargs:
    # Five 10 ms simulation ticks per action; inference does not advance time.
    control_hz: 20.0
    max_episode_seconds: 120.0
  text_prompt: Drive the Trackmania circuit to the finish.
  device: cpu

rl:
  _target_: rl.ppo.PPOAlgorithm
  # Short integration sample: 6.4 seconds at 20 Hz. Stock PPO resets every
  # rollout; 2400 decisions cover the configured 120-second episode limit.
  steps_per_rollout: 128
  num_policy_epochs: 4
  minibatch_size: 32
  gae:
    _target_: rl.advantages.GAEConfig
    gamma: 0.99
    lam: 0.95

rollout_buffer:
  _target_: rl.rollout_buffer.OnPolicyRolloutBuffer
  num_steps: ${rl.steps_per_rollout}
  num_envs: ${env.num_envs}
  action_shape: [1, 3]
  obs_keys: [text, telemetry, timing, previous_action, applied_action]
