[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trackmaniabench"
version = "0.1.0"
description = "Reproducible Trackmania replay datasets with native chase-camera video and original controls"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "extractor/THIRD_PARTY_NOTICES.md"]
authors = [{name = "TrackManiaBench contributors"}]
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.12,<1"]

[project.scripts]
tmbench = "trackmaniabench.cli:main"

[project.urls]
Repository = "https://github.com/quasar-zeroth/TrackManiaBench"
Issues = "https://github.com/quasar-zeroth/TrackManiaBench/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["trackmaniabench*", "collector*", "renderer*", "dataset*", "extractor*", "setup*"]
exclude = ["**.tests*", "**.validation*", "**.bin*", "**.obj*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml", "*.as", "*.cs", "*.csproj", "*.md", "NuGet.Config"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
